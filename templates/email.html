<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Send Email - CareerSaathi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
        background-image: url('https://img.freepik.com/free-vector/geometric-science-education-background-vector-gradient-blue-digital-remix_53876-125993.jpg');
      
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Glassmorphism Card */
    .card {
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      animation: fadeInUp 0.8s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      background: transparent;
      border-bottom: none;
      text-align: center;
      color: #ffffff;
    }

    .card-header h4 {
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Floating labels */
    .form-floating label {
      transition: all 0.3s ease;
      color: #6c757d;
    }
    .form-floating input:focus + label,
    .form-floating textarea:focus + label {
      color: #0d6efd;
      transform: translateY(-0.5rem);
    }

    /* Gradient Button with Ripple */
    .btn-send {
      background: linear-gradient(135deg, #28a745, #20c997);
      border: none;
      color: #fff;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .btn-send:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(32, 201, 151, 0.5);
    }

    .btn-send:active::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 300%;
      height: 300%;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: ripple 0.6s linear;
    }
    @keyframes ripple {
      from { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    /* Popup overlay */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1050;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }

    .popup-card {
      background: #fff;
      padding: 2rem;
      border-radius: 1rem;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      animation: scaleBounce 0.6s ease;
    }
    @keyframes scaleBounce {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }

    .circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle.success { background: #28a745; }
    .circle.error { background: #dc3545; }

    svg { width: 60px; height: 60px; }
    .path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 1s forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* Loader spinner */
    .spinner-border {
      width: 3rem;
      height: 3rem;
    }
  </style>
</head>
<body>
  <div class="container px-4">
    <div class="card p-4 shadow-lg">
      <div class="card-header">
        <h2>CareerSaathi Email</h2>
      </div>
      <div class="card-body">
        <form id="email-form" enctype="multipart/form-data" class="needs-validation" novalidate>
          <div class="form-floating mb-3">
            <input type="email" name="to_email" class="form-control" id="toEmail" placeholder="Recipient Email" required>
            <label for="toEmail">Recipient Email</label>
          </div>
          <div class="form-floating mb-3">
            <input type="text" name="subject" class="form-control" id="subject" placeholder="Subject">
            <label for="subject">Subject</label>
          </div>
          <div class="form-floating mb-3">
            <textarea name="body" class="form-control" placeholder="Type your message here..." id="body" style="height: 150px" required></textarea>
            <label for="body">Message</label>
          </div>

          <!-- File Attach -->
          <div class="mb-3">
            <label class="form-label text-white">Attach File (Optional)</label>
            <input type="file" name="attachment" class="form-control">
            <small class="text-light" id="resumeNote"></small>
          <div class="d-flex justify-content-between gap-3 mt-3">
              <button type="submit" class="btn btn-send flex-fill py-2 w-75">🚀 Send Email</button>
            <a class="btn btn-warning flex-fill py-2 w-25" href="/index">⬅️ Back</a>

        </div>
          
        </form>
      </div>
    </div>
  </div>

  <!-- Popup -->
  <div class="overlay hidden" id="popup-overlay">
    <div class="popup-card">
      <div id="popup-circle"></div>
      <h5 id="popup-message"></h5>
      <button class="btn btn-primary mt-3 d-none" id="popup-ok">Okay</button>
    </div>
  </div>

  <script>
    const form = document.getElementById("email-form");
    const overlay = document.getElementById("popup-overlay");
    const circle = document.getElementById("popup-circle");
    const message = document.getElementById("popup-message");
    const okBtn = document.getElementById("popup-ok");

    const resumeAttached = "{{ resume_filename if resume_filename else '' }}";
    if (resumeAttached) {
      document.getElementById("resumeNote").innerText =
        "Your resume (" + resumeAttached + ") will be auto-attached.";
    }

    function getSuccessSVG() {
      return `<svg viewBox="0 0 52 52"><path class="path" fill="none" stroke="#fff" stroke-width="5" d="M14 27l7 7 17-17"/></svg>`;
    }
    function getErrorSVG() {
      return `<svg viewBox="0 0 52 52"><path class="path" fill="none" stroke="#fff" stroke-width="5" d="M16 16 36 36"/><path class="path" fill="none" stroke="#fff" stroke-width="5" d="M36 16 16 36"/></svg>`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      if (resumeAttached) {
        formData.append("resume_file", resumeAttached);
      }

      // Show loader
      overlay.classList.remove("hidden");
      circle.className = "";
      circle.innerHTML = `<div class="spinner-border text-primary" role="status"></div>`;
      message.textContent = "Sending email... Please wait";
      okBtn.classList.add("d-none");

      try {
        const resp = await fetch("/send_email", { method: "POST", body: formData });
        const result = await resp.json();

        if (result.status === "sent") {
          circle.className = "circle success";
          circle.innerHTML = getSuccessSVG();
          message.textContent = "Email sent successfully! 🎉";
        } else {
          circle.className = "circle error";
          circle.innerHTML = getErrorSVG();
          message.textContent = "Failed to send email ❌";
        }
      } catch (err) {
        circle.className = "circle error";
        circle.innerHTML = getErrorSVG();
        message.textContent = "An error occurred while sending ⚠️";
      }

      // Show OK button after response
      okBtn.classList.remove("d-none");
    });

    okBtn.addEventListener("click", () => {
      overlay.classList.add("hidden");
    });
  </script>
</body>
</html>
