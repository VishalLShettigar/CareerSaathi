<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VISHAL L SHETTIGAR - Resume</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body {
      background: url('https://images.unsplash.com/photo-1531297484001-80022131f5a1') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', sans-serif;
      color: #1e293b;
    }

    /* Fade in animation */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Resume Card */
    .resume-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 16px;
      border: 3px solid #0d6efd;
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
      animation: fadeInUp 0.8s ease-in-out;
      transition: all 0.4s ease-in-out;
    }
    .resume-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }

    /* Profile Image */
    .profile-img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #0d6efd;
      margin-bottom: 15px;
      transition: transform 0.3s ease;
    }
    .profile-img:hover { transform: scale(1.05); }

    /* Headings */
    h1.title {
      font-size: 32px;
      font-weight: 700;
      color: #0d6efd;
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }
    h5 {
      margin-top: 25px;
      color: #0d6efd;
      font-weight: 600;
      border-bottom: 1px solid #ccc;
      padding-bottom: 6px;
      transition: color 0.3s ease;
    }

    /* Lists */
    ul { padding-left: 20px; }
    ul li { margin-bottom: 5px; }

    /* Dark Mode */
    .dark-mode {
      background: #0f172a !important;
      color: #f8fafc !important;
    }
    .dark-mode .resume-container {
      background: rgba(30, 41, 59, 0.95) !important;
      border-color: #38bdf8 !important;
      color: #f8fafc !important;
    }
    .dark-mode h1.title,
    .dark-mode h5 {
      color: #38bdf8 !important;
    }

    /* Control Card */
    .control-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 25px;
      border-radius: 16px;
      border: 2px solid #6c757d;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      animation: fadeInUp 1s ease-in-out;
      transition: all 0.3s ease-in-out;
      position: sticky;
      top: 20px;
    }
    .control-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }

    /* Buttons */
    .btn {
      transition: all 0.3s ease-in-out;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    /* Print mode */
    @media print {
      body * { visibility: hidden !important; }
      #resumeSection, #resumeSection * { visibility: visible !important; }
      #resumeSection { position: absolute; top: 0; left: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row g-4">
      
      <!-- Resume Column -->
      <div class="col-lg-8" id="resumeSection">
        <div class="resume-container" id="resume">
          <h1 class="title">RESUME</h1>
          <div class="text-center mb-4">
            
            <h2 class="fw-bold">VISHAL L SHETTIGAR</h2>
            <p>lsvishalshettigar@gmail.com | 9663135942 | <a href="" target="_blank">LinkedIn</a></p>
          </div>

          <!-- Resume Content -->
          <h5>Education</h5><ul><li></li></ul>
          <h5>Experience</h5><p></p>
          <h5>Projects</h5><ul><li></li></ul>
          <h5>Achievements</h5><ul><li></li></ul>
          <h5>Workshops</h5><ul><li></li></ul>
          <h5>Skills</h5><p></p>
          <h5>Certifications</h5><ul><li></li></ul>
          <h5>Courses</h5><p></p>
        </div>
      </div>
      
      <!-- Controls Column -->
      <div class="col-lg-4 no-print">
        <div class="control-card">
          <h5 class="text-center mb-3">⚙️ Controls</h5>
          <div class="d-grid gap-2">
            <button class="btn btn-primary" onclick="downloadPDF()"><i class="bi bi-download"></i> Download as PDF</button>
            <button class="btn btn-secondary" onclick="printResume()"><i class="bi bi-printer"></i> Print Resume</button>
            <button class="btn btn-dark" onclick="toggleTheme()"><i class="bi bi-moon-stars"></i> Toggle Theme</button>
            <a href="/email" class="btn btn-success"><i class="bi bi-envelope"></i> Send via Email</a>
          </div>
          <div class="mt-4">
            <label for="themeSelect" class="form-label fw-semibold">🎨 Choose Theme:</label>
            <select id="themeSelect" class="form-select" onchange="switchTemplate(this.value)">
              <option value="default">Default (Blue)</option>
              <option value="green">Green</option>
              <option value="purple">Purple</option>
              <option value="red">Red</option>
            </select>
          </div>
        </div>
      </div>

    </div>
  </div>
  <!-- templates/footer.html -->
<style>
  footer {
    width: 100%;
    overflow: hidden;
    position: relative;
    background: #222;
    height: 50px;
    margin-top: 30px;
  }
  .moving-footer {
    position: absolute;
    white-space: nowrap;
    animation: slide 10s linear infinite, colorChange 5s ease-in-out infinite;
    font-size: 1rem;
    padding: 15px;
    color: white;
  }
  @keyframes slide {
    0% { left: 100%; }
    100% { left: -100%; }
  }
  @keyframes colorChange {
    0% { color: #ff7675; }
    25% { color: #74b9ff; }
    50% { color: #55efc4; }
    75% { color: #ffeaa7; }
    100% { color: #fd79a8; }
  }
</style>

<footer>
  <div class="moving-footer">
    🚀 AI-Based Career Counselor | MCA Final Year Project | Made with ❤️ by Vishal L Shettigar
  </div>
</footer>
  
  <script>
    function downloadPDF() {
      const element = document.getElementById('resume');
      html2pdf().from(element).save('VISHAL_L_SHETTIGAR_Resume.pdf');
    }
    function printResume() { window.print(); }
    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
    }
    function switchTemplate(theme) {
      const container = document.getElementById('resume');
      const title = container.querySelector('.title');
      const headers = container.querySelectorAll('h5');
      let color;
      switch (theme) {
        case 'green': color = '#28a745'; break;
        case 'purple': color = '#6f42c1'; break;
        case 'red': color = '#dc3545'; break;
        default: color = '#0d6efd';
      }
      container.style.borderColor = color;
      title.style.color = color;
      headers.forEach(h => h.style.color = color);
    }
  </script>
</body>
</html>
